<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FeelHub4u — Movies & Songs</title>
<meta name="description" content="FeelHub4u: discover movies by mood, trend and language, watch trailers, find where to stream, and listen to songs.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237C5CFF'/><path d='M12 9l11 7-11 7z' fill='%23fff'/></svg>">
<style>
:root{--p:#7C5CFF;--s:#22D3EE;--a:#FBBF24;--bg:#07080C;--sf:#12141C;--tx:#EEF0F7;--mu:#8A90A6;--bd:rgba(255,255,255,.08);--mx:50%;--my:30%}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#F4F5FA;--sf:#FFF;--tx:#14161F;--mu:#6B7185;--bd:rgba(20,22,31,.1)}}
:root[data-theme=light]{--bg:#F4F5FA;--sf:#FFF;--tx:#14161F;--mu:#6B7185;--bd:rgba(20,22,31,.1)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .4s,color .4s}
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:560px;height:560px;border-radius:50%;filter:blur(100px);opacity:.3;animation:float 20s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--p);top:-200px;left:-160px}
.aurora i:nth-child(2){background:var(--s);top:35%;right:-220px;animation-duration:24s;animation-delay:-8s}
.aurora i:nth-child(3){background:var(--a);bottom:-260px;left:30%;opacity:.14;animation-duration:28s;animation-delay:-12s}
.spot{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle 520px at var(--mx) var(--my),rgba(124,92,255,.13),transparent 60%)}
@keyframes float{to{transform:translate(120px,80px) scale(1.15)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}}
@keyframes shine{to{background-position:-200% 0}}
header{--sf:#12141C;--tx:#EEF0F7;--mu:#8A90A6;--bd:rgba(255,255,255,.1);position:sticky;top:0;z-index:20;color:var(--tx);background:rgba(7,8,12,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{display:block;flex:none;line-height:0}
.brand img{height:40px;width:auto;mix-blend-mode:screen;transition:transform .3s}
.brand:hover img{transform:scale(1.04)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--sf);border:1px solid var(--bd)}
.tab{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.9rem;font-weight:600;color:var(--mu);background:none;border:0;border-radius:9px;padding:7px 12px;cursor:pointer;transition:.25s}
.tab.on{color:#fff;background:linear-gradient(135deg,var(--p),var(--s));box-shadow:0 6px 18px -6px rgba(124,92,255,.6)}
.search{position:relative;flex:1;min-width:180px;max-width:420px}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mu);pointer-events:none}
.search input{width:100%;padding-left:38px}
input,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
select{padding:9px 8px}
input:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(124,92,255,.18)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.icon{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer;transition:transform .2s}
.icon:hover{transform:scale(1.06)}
.hero{max-width:1200px;margin:auto;padding:28px 18px 4px;animation:fadeUp .7s backwards}
.hero h1{margin:0;font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.1;letter-spacing:-.03em}
.hero h1 span{background:linear-gradient(90deg,var(--s),var(--p),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:8px 0 0;color:var(--mu)}
.bar{max-width:1200px;margin:auto;display:flex;gap:8px;align-items:center;padding:16px 18px 6px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.85rem;cursor:pointer;color:var(--mu);background:var(--sf);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;transition:transform .2s,color .2s,box-shadow .2s}
.chip:hover{color:var(--tx);transform:translateY(-1px)}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--p),var(--s));box-shadow:0 6px 20px rgba(124,92,255,.35)}
.sep{flex:none;width:1px;height:22px;background:var(--bd);margin:0 4px}
main{max-width:1200px;margin:auto;padding:16px 18px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:18px}
.card{cursor:pointer;outline:none;position:relative;border-radius:16px;overflow:hidden;background:var(--sf);border:1px solid var(--bd);animation:fadeUp .6s backwards;animation-delay:calc(var(--i) * 45ms);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.card:hover,.card:focus-visible{transform:translateY(-6px);box-shadow:0 18px 40px -12px rgba(124,92,255,.45);border-color:rgba(124,92,255,.5)}
.poster{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--bd)}
.card.song .poster{aspect-ratio:1}
.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.card:hover .poster img{transform:scale(1.06)}
.rate{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;color:var(--a);background:rgba(10,10,15,.72);backdrop-filter:blur(6px);padding:4px 9px;border-radius:999px}
.rate .i{width:12px;height:12px}
.over{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:14px;color:#fff;font-weight:600;font-size:.85rem;background:linear-gradient(transparent 40%,rgba(0,0,0,.85));opacity:0;transition:opacity .3s}
.play{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;background:linear-gradient(135deg,var(--p),var(--s));box-shadow:0 10px 30px rgba(124,92,255,.5);opacity:0;transform:scale(.8);transition:opacity .3s,transform .3s}
.play .i{width:22px;height:22px;margin-left:3px}
.card:hover .over,.card:focus-visible .over{opacity:1}
.card:hover .play,.card.playing .play{opacity:1;transform:scale(1)}
.meta{padding:10px 12px 12px}
.meta h3{margin:0;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:2px 0 0;font-size:.8rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.noimg{height:100%;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;color:var(--mu)}
.skel{aspect-ratio:2/3;border-radius:16px;overflow:hidden;border:1px solid var(--bd)}
.sk{height:100%;background:linear-gradient(90deg,var(--sf) 25%,var(--bd) 50%,var(--sf) 75%) 0 0/200% 100%;animation:shine 1.2s linear infinite}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 0}
.more{display:flex;margin:30px auto 0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:0;border-radius:12px;font:inherit;font-weight:600;color:#fff;text-decoration:none;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--s));transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(124,92,255,.6)}
.btn .i{width:17px;height:17px}
.btn.gh{color:var(--tx);background:transparent;border:1px solid var(--bd)}
.foot{background:#07080C;color:#8A90A6;text-align:center;font-size:.78rem;padding:26px 18px 96px}
.foot img{height:34px;opacity:.9;mix-blend-mode:screen;margin-bottom:6px}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(5,6,10,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal.open{display:flex;animation:fade .25s}
.dlg{position:relative;width:min(860px,100%);max-height:90vh;overflow:auto;border-radius:22px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.close{position:absolute;top:12px;right:12px;z-index:3;background:rgba(10,10,15,.6);color:#fff;border-color:transparent}
.bd{height:280px;background:#0d0f16 center/cover no-repeat;position:relative}
.bd::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--sf))}
.in{position:relative;margin-top:-70px;padding:0 24px 24px}
.in h2{margin:0;font-size:1.6rem;letter-spacing:-.02em}
.sub{margin:4px 0 12px;font-size:.9rem;color:var(--a)}
.vid{position:relative;aspect-ratio:16/9;margin:18px 0;border-radius:14px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
h4{margin:22px 0 8px}
.prow{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin:8px 0}
.prow b{min-width:60px;font-weight:600;color:var(--mu)}
.pchip{display:inline-flex;align-items:center;gap:6px;margin:3px;padding:5px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}
.pchip img{width:22px;height:22px;border-radius:6px}
.muted{color:var(--mu)}
.np{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:rgba(18,20,28,.88);color:#EEF0F7;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 50px -20px rgba(0,0,0,.7);animation:fadeUp .4s backwards}
.np img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.npt{flex:1;min-width:0;display:flex;flex-direction:column}
.npt b,.npt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npt span{font-size:.8rem;color:#8A90A6}
.np .icon{flex:none;background:linear-gradient(135deg,var(--p),var(--s));border:0;color:#fff}
body[data-mode=songs] .movies-only{display:none}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.search{order:5;max-width:none;flex-basis:100%}.tabs{order:2}.in{padding:0 16px 18px}.bd{height:200px}.brand img{height:34px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-mode="movies">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>

  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/></symbol>

</svg>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="spot"></div>

<header>
  <div class="nav">
    <a class="brand" id="home" href="/" aria-label="FeelHub4u home"><img src="assets/logo.png" alt="FeelHub4u"></a>
    <div class="tabs" role="tablist">
      <button class="tab on" data-m="movies" role="tab"><svg class="i"><use href="#i-film"/></svg>Movies</button>
      <button class="tab" data-m="songs" role="tab"><svg class="i"><use href="#i-music"/></svg>Songs</button>
    </div>
    <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" autocomplete="off" aria-label="Search"></label>
    <select id="lang" class="movies-only" aria-label="Language"></select>
    <select id="region" class="movies-only" aria-label="Streaming region"></select>
    <button class="icon" id="theme" aria-label="Toggle theme"><svg class="i"><use href="#i-moon"/></svg></button>
  </div>
</header>

<section class="hero"><h1 id="h1"></h1><p id="sub"></p></section>
<nav class="bar" id="chips" aria-label="Categories"></nav>
<main>
  <div class="grid" id="grid"></div>
  <button class="btn gh more movies-only" id="more" hidden>Load more</button>
</main>

<footer class="foot">
  <img src="assets/logo.png" alt="FeelHub4u">
  <p>Not endorsed or certified by TMDB. Movie data by TMDB, streaming by JustWatch, song previews by Apple.</p>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="dlg">
    <button class="icon close" id="close" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
    <div id="mbody"></div>
  </div>
</div>

<div class="np" id="np" hidden>
  <img id="npArt" alt="">
  <div class="npt"><b id="npT"></b><span id="npA"></span></div>
  <button class="icon" id="npBtn" aria-label="Play or pause"><svg class="i f"><use href="#i-pause"/></svg></button>
</div>

<script src="app.js"></script>
</body>
</html>
