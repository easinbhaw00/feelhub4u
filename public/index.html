<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FeelHub4u — Movies, Anime & Songs</title>
<meta name="description" content="FeelHub4u: find trending and upcoming movies, anime and songs. Trailers, cast, streaming options, a saved list and a helpful assistant.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--bg:#060608;--sf:rgba(255,255,255,.05);--sf2:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--tx:#F4F5F8;--mu:#9097A6;--si:linear-gradient(135deg,#fff 0%,#c9cfdb 38%,#f8f9fc 58%,#8d95a5 100%);--ease:cubic-bezier(.2,.8,.2,1);--mx:50%;--my:30%}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#F3F4F7;--sf:rgba(0,0,0,.035);--sf2:rgba(0,0,0,.07);--line:rgba(0,0,0,.09);--tx:#0c0d12;--mu:#616879}}
:root[data-theme=light]{--bg:#F3F4F7;--sf:rgba(0,0,0,.035);--sf2:rgba(0,0,0,.07);--line:rgba(0,0,0,.09);--tx:#0c0d12;--mu:#616879}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.mesh{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.mesh i{position:absolute;width:55vw;height:55vw;border-radius:50%;filter:blur(110px);opacity:.28;animation:mv 28s ease-in-out infinite alternate}
.mesh i:nth-child(1){background:#c8d2e6;top:-20vw;left:-15vw}
.mesh i:nth-child(2){background:#6b7490;right:-20vw;top:30vh;animation-duration:34s;animation-delay:-9s}
.mesh i:nth-child(3){background:#fff;opacity:.09;bottom:-25vw;left:25vw;animation-duration:40s;animation-delay:-16s}
.spot{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle 560px at var(--mx) var(--my),rgba(255,255,255,.075),transparent 62%)}
@keyframes mv{to{transform:translate(8vw,6vh) scale(1.12)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
@keyframes fd{from{opacity:0}}
@keyframes sl{from{opacity:0;transform:translateY(36px) scale(.97)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes sweep{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,40%,100%{transform:rotate(0)}8%{transform:rotate(-9deg)}16%{transform:rotate(9deg)}24%{transform:rotate(-6deg)}32%{transform:rotate(6deg)}}
@keyframes ping{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
input,select{font:inherit;color:var(--tx)}
select{font-size:.86rem;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:9px 14px;outline:none}
.top{--sf:rgba(255,255,255,.06);--sf2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);--tx:#F4F5F8;--mu:#9097A6;position:sticky;top:10px;z-index:40;width:min(1240px,calc(100% - 24px));margin:10px auto 0;display:flex;align-items:center;gap:14px;padding:8px 10px 8px 14px;border-radius:999px;background:rgba(10,10,14,.72);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);box-shadow:0 20px 50px -28px #000;color:var(--tx)}
.brand{display:block;flex:none;line-height:0}
.brand img{height:38px;width:auto;display:block;mix-blend-mode:screen;transition:transform .45s var(--ease),filter .4s}
.brand:hover img{transform:scale(1.05);filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}
.pills{display:flex;gap:2px}
.pill{font:inherit;font-size:.86rem;font-weight:500;color:var(--mu);background:none;border:0;padding:8px 13px;border-radius:999px;cursor:pointer;transition:.3s var(--ease)}
.pill:hover{color:#fff;background:var(--sf2)}
.pill.on{color:#060608;background:var(--si);font-weight:600}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.sx{position:relative}
.search{display:flex;align-items:center;gap:8px;width:min(260px,26vw);padding:0 12px;border-radius:999px;background:var(--sf);border:1px solid var(--line);transition:.3s}
.search:focus-within{border-color:rgba(255,255,255,.45);box-shadow:0 0 0 4px rgba(255,255,255,.07)}
.search .i{width:16px;height:16px;color:var(--mu);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:.9rem;padding:9px 0}
kbd{font:600 .7rem Inter,system-ui,sans-serif;color:var(--mu);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.sug{position:absolute;top:calc(100% + 10px);left:0;right:0;min-width:300px;z-index:60;padding:8px;border-radius:22px;background:rgba(12,13,18,.97);border:1px solid var(--line);box-shadow:0 30px 60px -20px #000;animation:up .35s var(--ease)}
.sg{display:flex;gap:10px;align-items:center;width:100%;padding:8px;border:0;border-radius:14px;background:none;color:var(--tx);cursor:pointer;text-align:left;font:inherit}
.sg:hover{background:var(--sf2)}
.sg img{width:36px;height:52px;object-fit:cover;border-radius:8px;flex:none}
.sg-n{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sf2);flex:none}
.sg b{display:block;font-size:.9rem;font-weight:600}
.sg small{color:var(--mu);font-size:.75rem}
.sg-h{font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);padding:8px 10px}
.ib{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--sf);color:var(--tx);cursor:pointer;transition:transform .35s var(--ease),background .3s}
.ib:hover{transform:rotate(-10deg) scale(1.05);background:var(--sf2)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.dock{display:none;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:45;gap:2px;padding:6px;border-radius:24px;background:rgba(12,12,16,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 50px -18px #000}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:.66rem;font-weight:500;color:#9097A6;background:none;border:0;padding:8px 12px;border-radius:18px;cursor:pointer;transition:.3s var(--ease)}
.dock button .i{width:19px;height:19px}
.dock button.on{color:#060608;background:var(--si)}
main{width:min(1240px,calc(100% - 28px));margin:0 auto;padding-bottom:40px}
.bar{display:flex;gap:8px;align-items:center;padding:20px 0 6px}
#lang{flex:none}
#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center;flex:1;min-width:0;padding:2px}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.84rem;color:var(--mu);background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;transition:.3s var(--ease)}
.chip:hover{color:var(--tx);border-color:rgba(255,255,255,.3)}
.chip.on{color:#060608;background:var(--si);border-color:transparent}
.sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 4px}
.kicker{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin-bottom:18px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;min-height:min(74vh,600px);padding:40px 0 12px;animation:up 1s var(--ease) backwards}
.hero h1{font-size:clamp(2.3rem,5.6vw,4.6rem);line-height:1;letter-spacing:-.045em;margin:0 0 18px;font-weight:800}
.hero h1 span{background:var(--si);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);font-size:1.02rem;max-width:520px;margin:0}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btnp,.btng{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .35s var(--ease),box-shadow .35s,border-color .3s,background .3s}
.btnp{border:0;background:var(--si);color:#060608}
.btnp:hover{transform:translateY(-3px);box-shadow:0 18px 36px -12px rgba(255,255,255,.4)}
.btng{border:1px solid var(--line);background:transparent;color:var(--tx)}
.btng:hover{border-color:rgba(255,255,255,.45);background:var(--sf)}
.btng.on{background:#fff;color:#060608}
.btng.on .i{fill:currentColor}
.hero-card{position:relative;justify-self:end;width:min(360px,100%);aspect-ratio:2/3;border-radius:30px;overflow:hidden;border:1px solid var(--line);background:#0B0C10;box-shadow:0 50px 100px -40px #000;animation:float 8s ease-in-out infinite}
.hero-card img{width:100%;height:100%;object-fit:cover;display:block}
.hero-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 6s ease-in-out infinite}
.hc-tag{position:absolute;top:18px;left:18px;padding:6px 12px;border-radius:999px;font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#060608;background:var(--si)}
.hc-info{position:absolute;left:0;right:0;bottom:0;padding:70px 24px 24px;background:linear-gradient(transparent,rgba(5,5,6,.96) 45%);color:#F4F5F8}

.hc-meta{display:flex;align-items:center;gap:10px;color:#C2C8D3;font-size:.82rem;margin-bottom:10px}
.hc-ov{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 16px;color:#AEB4C0;font-size:.86rem;line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:.75rem;font-weight:700;color:#F4F5F8;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);position:absolute;top:12px;left:12px}
.hc-meta .badge{position:static}
.badge .i{width:12px;height:12px}
.row{margin:46px 0 8px}
.row h2{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:1.3rem;font-weight:700;letter-spacing:-.025em;margin:0 0 16px}
.row h2 a{font-size:.85rem;font-weight:500;color:var(--mu);cursor:pointer}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 2px 22px;scrollbar-width:none}
.rail>*{flex:none;width:clamp(154px,26vw,206px);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(154px,25vw,212px),1fr));gap:clamp(14px,2vw,24px)}
.card{position:relative;border-radius:22px;overflow:hidden;background:var(--sf);border:1px solid var(--line);cursor:pointer;outline:none;transition:transform .45s var(--ease),box-shadow .5s,border-color .4s;animation:up .8s var(--ease) backwards;animation-delay:calc(var(--i) * 55ms)}
.card:hover,.card:focus-visible{box-shadow:0 40px 70px -28px #000,0 0 0 1px rgba(255,255,255,.22);border-color:rgba(255,255,255,.3)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);transform:translateX(-120%);transition:transform .9s var(--ease)}
.card:hover::after{transform:translateX(120%)}
.poster{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--sf2)}
.card.song .poster{aspect-ratio:1}
.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s var(--ease)}
.card:hover .poster img{transform:scale(1.07)}
.card .badge{top:10px;left:10px}
.fav{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#fff;cursor:pointer;transition:transform .3s var(--ease),background .3s,color .3s}
.fav:hover{transform:scale(1.12)}
.fav .i{width:17px;height:17px}
.fav.on{background:#fff;color:#060608}
.fav.on .i{fill:currentColor}
.cdw{position:absolute;left:0;right:0;bottom:0;padding:34px 10px 10px;display:flex;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.92))}
.cdk{display:flex;gap:6px}
.cdk span{display:flex;flex-direction:column;align-items:center;min-width:44px;padding:6px 4px;border-radius:12px;background:rgba(255,255,255,.13);backdrop-filter:blur(6px);color:#fff;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em}
.cdk b{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cdk-out{font-size:.8rem;font-weight:700;color:#fff}
.play{position:absolute;top:50%;left:50%;width:58px;height:58px;margin:-29px 0 0 -29px;display:grid;place-items:center;border-radius:50%;background:var(--si);color:#060608;opacity:0;transform:scale(.6);transition:.45s var(--ease)}
.play .i{width:22px;height:22px;margin-left:3px}
.card:hover .play,.card.playing .play{opacity:1;transform:scale(1)}
.meta{padding:12px 14px 15px}
.meta h3{margin:0;font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:3px 0 0;font-size:.8rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.noimg{height:100%;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;color:var(--mu)}
.skel{aspect-ratio:2/3;border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.sk{height:100%;background:linear-gradient(90deg,var(--sf) 25%,var(--sf2) 50%,var(--sf) 75%) 0 0/200% 100%;animation:shine 1.2s linear infinite}
.empty-s{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--mu)}
.empty-s .ghost{width:96px;height:96px;margin:0 auto 20px;border-radius:30px;display:grid;place-items:center;background:var(--sf2);border:1px solid var(--line);animation:float 5s ease-in-out infinite}
.empty-s .i{width:38px;height:38px;color:var(--tx)}
.empty-s h3{color:var(--tx);margin:0 0 6px;font-size:1.25rem;letter-spacing:-.02em}
.empty-s p{margin:0 auto;max-width:380px}
.err{position:relative;grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;max-width:480px;margin:30px auto;padding:58px 26px;border-radius:30px;background:var(--sf);border:1px solid var(--line);overflow:hidden;animation:up .6s var(--ease)}
.err::before{content:"";position:absolute;inset:-50%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0deg,rgba(255,255,255,.12) 40deg,transparent 90deg);animation:spin 9s linear infinite}
.err>*{position:relative}
.err-ic{position:relative;width:80px;height:80px;display:grid;place-items:center;border-radius:24px;background:var(--sf2);border:1px solid var(--line);animation:shake 3s ease-in-out infinite}

.err-ic .i{width:34px;height:34px;color:var(--tx)}
.err h3{margin:6px 0 0;font-size:1.3rem;letter-spacing:-.02em}
.err p{margin:0;color:var(--mu);font-size:.92rem;max-width:340px}
.err .btnp{margin-top:8px}
.foot{margin-top:70px;padding:34px clamp(14px,3vw,32px) 120px;background:#050506;color:#8B909C;font-size:.82rem;border-top:1px solid rgba(255,255,255,.08)}
.foot-in{width:min(1240px,100%);margin:0 auto;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.fb{display:flex;align-items:center;gap:14px}
.fb img{height:34px;mix-blend-mode:screen}
.foot nav{display:flex;gap:18px;flex-wrap:wrap}
.foot button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.foot button:hover{color:#F4F5F8}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(3,3,5,.6);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.modal.open{display:flex;animation:fd .35s}
.dlg{position:relative;width:min(980px,100%);max-height:92vh;overflow:auto;border-radius:32px;background:#0A0B0F;color:#F4F5F8;border:1px solid rgba(255,255,255,.1);box-shadow:0 80px 140px -50px #000;animation:sl .6s var(--ease)}
.dlg::-webkit-scrollbar{width:0}
.close{position:absolute;top:14px;right:14px;z-index:5;background:rgba(10,10,15,.7);color:#fff;border-color:rgba(255,255,255,.15)}
.bd{height:340px;background:#0d0f16 center/cover no-repeat;position:relative}
.bd::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,11,15,.95),rgba(10,11,15,.2) 60%),linear-gradient(transparent 40%,#0A0B0F)}
.in{position:relative;margin-top:-150px;padding:0 34px 34px}
.mhead{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}

.mhead>div{flex:1;min-width:240px;padding-bottom:6px}
.in h2,.pad h2{margin:0 0 6px;font-size:clamp(1.6rem,3.5vw,2.4rem);letter-spacing:-.03em;font-weight:800}
.sub{color:#C2C8D3;font-size:.92rem}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}

.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

h4{margin:26px 0 10px;font-size:1.05rem}
.cast{display:flex;gap:14px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.cc{flex:none;width:96px;text-align:center}
.cc img,.cc span{width:86px;height:86px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px;background:#1a1c24}

.wh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 10px;flex-wrap:wrap}

.rsel{max-width:240px}
.prow{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin:8px 0}

.pchip{display:inline-flex;align-items:center;gap:6px;margin:3px;padding:6px 12px;border-radius:12px;background:#15161C;border:1px solid rgba(255,255,255,.1);font-size:.86rem}

.ch-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:20px 20px 12px}
.ch-h b{display:block;font-size:1.02rem}
.ch-h small{color:#9097A6;font-size:.74rem}
.ch-q{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 12px}
.ch-q button{font:inherit;font-size:.76rem;color:#C2C8D3;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;cursor:pointer}
.ch-q button:hover{color:#fff;border-color:rgba(255,255,255,.35)}
.msgs{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.b{max-width:86%;padding:11px 15px;border-radius:18px;font-size:.92rem;line-height:1.5;animation:up .35s var(--ease);white-space:pre-wrap}
.b.a{align-self:flex-start;background:rgba(255,255,255,.08);border-bottom-left-radius:6px}
.b.u{align-self:flex-end;background:var(--si);color:#060608;border-bottom-right-radius:6px}
.b.typing{display:flex;gap:4px;padding:14px 16px}
.b.typing i{width:6px;height:6px;border-radius:50%;background:#9097A6;animation:dot 1.2s infinite}
.b.typing i:nth-child(2){animation-delay:.2s}
.b.typing i:nth-child(3){animation-delay:.4s}
.cpicks{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.cp{flex:none;width:100px;border:0;background:none;color:#F4F5F8;cursor:pointer;text-align:left;font:inherit;font-size:.74rem;padding:0}
.cp img{width:100px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;display:block;margin-bottom:6px;border:1px solid rgba(255,255,255,.12)}
.cp span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch-f{display:flex;gap:8px;padding:14px 16px 18px;border-top:1px solid var(--line)}
.ch-f input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:11px 16px;outline:0}
.ch-f input:focus{border-color:rgba(255,255,255,.4)}
.np{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;width:min(660px,calc(100% - 24px));display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:24px;background:rgba(14,15,20,.84);color:#F4F5F8;backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 60px -20px #000;animation:up .5s var(--ease) backwards}
.np>img{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none}
.npt{min-width:0;flex:0 1 190px;display:flex;flex-direction:column}
.npt b,.npt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npt span{font-size:.78rem;color:#9097A6}
.nl{display:flex;gap:10px;margin-top:2px}
.nl a{font-size:.7rem;color:#C2C8D3;text-decoration:none}
.nl a:hover{color:#fff;text-decoration:underline}
.ptime{flex:1;display:flex;align-items:center;gap:10px;font-size:.72rem;color:#9097A6;font-variant-numeric:tabular-nums}
.pbar{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.14);cursor:pointer;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px;background:#fff}
.np .pl{flex:none;background:var(--si);color:#060608;border:0}
#toasts{position:fixed;top:92px;right:16px;z-index:95;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:rgba(14,15,20,.94);color:#F4F5F8;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 40px -18px #000;font-size:.88rem;animation:tin .45s var(--ease);transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateX(20px)}
.toast .i{width:17px;height:17px}
body[data-view=songs] #lang,body[data-view=anime] #lang,body[data-view=upcoming] #lang,body[data-view=home] #lang,body[data-view=list] #lang{display:none}
@media (max-width:920px){
  .pills{display:none}
  .dock{display:flex}
  .hero{grid-template-columns:1fr}
  .hero-card{justify-self:center;width:min(300px,100%)}
  .search{width:auto;flex:1}
}
@media (max-width:640px){
  .top{top:8px;width:calc(100% - 16px);padding:6px 8px 6px 10px;gap:8px}
  .brand img{height:30px}
  .tools .ib:not(#theme){display:none}
  .search kbd{display:none}
  main{padding-bottom:120px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .in{margin-top:-110px;padding:0 18px 22px}
  .mp{width:118px}
  .pad{padding:32px 22px}
  .chat{top:auto;left:0;width:100%;height:84dvh;border-left:0;border-top:1px solid var(--line);border-radius:30px 30px 0 0;transform:translateY(105%)}
  .chat.open{transform:none}
  .np{bottom:90px}
  .ptime{display:none}
  .npt{flex:1}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
